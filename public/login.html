<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="login-wrap">
    <div class="card login-card">
      <div class="login-head">
        <h1>Durga Puja Receipts</h1>
        <p>Authorized receipt creators only</p>
      </div>
      <form id="loginForm" class="login-body" autocomplete="on" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="loginBtn">Log in</button>
        <div id="msg" class="msg error" role="alert"></div>
      </form>
    </div>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
